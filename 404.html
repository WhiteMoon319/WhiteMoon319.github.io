        .error-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 40px 22px; }
        .error-content { max-width: 480px; }
        .error-code { font-family: var(--display); font-size: clamp(100px, 18vw, 180px); font-weight: 700; line-height: 1; background: var(--flame-grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 4px 20px var(--fire-glow)); margin-bottom: 8px; }

        .error-desc { color: var(--dim); font-size: 16px; line-height: 1.6; margin-bottom: 32px; }
        .error-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .error-actions .primary-btn { padding: 12px 32px; font-size: 14px; }
