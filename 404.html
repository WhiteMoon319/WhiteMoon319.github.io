    <link rel="stylesheet" href="/resource/css/base.css">
    <link rel="stylesheet" href="/resource/css/layout.css">
    <link rel="stylesheet" href="/resource/css/responsive.css">
    <link rel="stylesheet" href="/resource/css/components.css">
    <style>
        .error-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 40px 22px; position: relative; overflow: hidden; }
        .error-page::before { content: ""; position: absolute; inset: 0; background: radial-gradient(50% 50% at 50% 40%, rgba(249,115,22,0.08), transparent 70%); pointer-events: none; }
        .error-content { max-width: 520px; position: relative; z-index: 1; animation: fadeUp 0.6s var(--ease) both; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
        .error-code { font-family: var(--display); font-size: clamp(100px, 18vw, 180px); font-weight: 700; line-height: 1; background: var(--flame-grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 4px 20px var(--fire-glow)); margin-bottom: 8px; position: relative; }
        .error-code::after { content: ""; display: block; width: 80px; height: 4px; margin: 16px auto 0; border-radius: 4px; background: var(--flame-grad); box-shadow: 0 2px 12px var(--fire-glow); }
        .error-title { font-family: var(--display); font-size: 28px; color: var(--text); margin: 20px 0 12px; }
        .error-desc { color: var(--dim); font-size: 16px; line-height: 1.8; margin-bottom: 36px; }
        .error-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .error-actions .primary-btn { padding: 12px 32px; font-size: 14px; }
        .error-actions .ghost-btn { padding: 12px 28px; font-size: 14px; }
        .error-embers { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
        .error-embers i { position: absolute; bottom: -8px; width: 5px; height: 5px; border-radius: 50%; background: rgba(249,115,22,0.45); box-shadow: 0 0 8px rgba(251,191,36,0.5); opacity: 0; animation: rise linear infinite; }
        .error-embers i:nth-child(1) { left: 15%; animation-duration: 14s; animation-delay: 0s; }
        .error-embers i:nth-child(2) { left: 35%; width: 4px; height: 4px; animation-duration: 18s; animation-delay: 3s; }
        .error-embers i:nth-child(3) { left: 55%; width: 6px; height: 6px; animation-duration: 16s; animation-delay: 6s; background: rgba(239,68,68,0.4); }
        .error-embers i:nth-child(4) { left: 75%; width: 4px; height: 4px; animation-duration: 20s; animation-delay: 2s; }
        .error-embers i:nth-child(5) { left: 90%; animation-duration: 15s; animation-delay: 8s; background: rgba(251,191,36,0.5); }
    </style>
</head>
<body>
    <main>
        <div class="error-page">
            <div class="error-embers"><i></i><i></i><i></i><i></i><i></i></div>
            <div class="error-content">
                <div class="error-code">404</div>
                <h1 class="error-title">野火不灭，但路未寻见</h1>
                <p class="error-desc">你寻找的页面已在峡谷中迷失，<br>或已被野火烧尽。返回首页另觅方向吧。</p>
                <div class="error-actions">
                    <a class="primary-btn" href="/">返回首页</a>
                    <a class="ghost-btn" href="/news/">浏览新闻</a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
