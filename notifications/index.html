<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/webp" href="../resource/img/logo.webp">
    <link rel="apple-touch-icon" href="../resource/img/logo.webp">
    <meta name="description" content="YHG 通知中心 — 系统通知、评论回复、私信提醒。">
    <meta name="robots" content="noindex, nofollow">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="zh_CN">
    <meta property="og:title" content="通知 - YHG电子竞技战队">
    <meta property="og:description" content="YHG 通知中心 — 系统通知、评论回复、私信提醒。">
    <meta property="og:url" content="https://yhg.whitemoon319.xyz/notifications/">
    <link rel="canonical" href="https://yhg.whitemoon319.xyz/notifications/">
    <meta property="og:image" content="https://yhg.whitemoon319.xyz/resource/img/logo.webp">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ea580c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Rajdhani:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../resource/css/base.css">
    <link rel="stylesheet" href="../resource/css/layout.css">
    <link rel="stylesheet" href="../resource/css/responsive.css">
    <link rel="stylesheet" href="../resource/css/components.css">
    <style>
      .notif-tabs { display:flex; gap:6px; margin-bottom:20px; flex-wrap:wrap; }
      .notif-tab { padding:8px 16px; font-size:13px; font-weight:600;
        border:1px solid var(--line-2); border-radius:var(--r-sm);
        background:var(--surface); color:var(--text); cursor:pointer;
        transition:all 0.2s; }
      .notif-tab:hover { border-color:var(--fire); color:var(--fire); }
      .notif-tab.active { background:var(--fire); color:#fff; border-color:var(--fire); }
      .notif-item { cursor:pointer; }
    </style>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="../" aria-label="返回首页">
            <img src="../resource/img/logo.webp" alt="YHG战队标识">
            <span>YHG</span>
        </a>
        <nav class="nav" aria-label="主导航">
            <a href="../">HOME</a>
            <a href="../about/">ABOUT</a>
            <a href="../members/">ROSTER</a>
            <a href="../matches/">MATCHES</a>
            <a href="../news/">NEWS</a>
        </nav>
        <div id="authWidget" style="cursor:default;">通知</div>
    </header>

    <main>
        <div class="notif-page">
            <div class="notif-page-top">
                <h1>通知</h1>
                <button class="notif-mark-read" id="markAllReadPage" style="font-size:13px;padding:8px 16px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);">全部已读</button>
            </div>
            <div class="notif-tabs" id="notifTabs"></div>
            <div class="notif-list" id="notifList">
                <div class="notif-empty">加载中…</div>
            </div>
            <div class="notif-page-controls" id="notifPageControls"></div>
        </div>
    </main>

    <footer>
        <p>© 2026 YHG ESPORTS · Honor of Kings esports team</p>
    </footer>

    <script defer src="../resource/js/main.js"></script>
    <script defer src="../resource/js/auth.js"></script>
    <script defer src="../resource/js/notifications.js"></script>
</body>
</html>
