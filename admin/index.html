<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="apple-touch-icon" href="../resource/img/logo.webp">

    <meta property="og:locale" content="zh_CN">
    <meta property="og:title" content="管理面板 - YHG电子竞技战队">
    <meta property="og:description" content="YHG 战队管理后台 — 用户、文章、选手、赛事、公告内容管理。">
    <meta property="og:url" content="https://yhg.whitemoon319.xyz/admin/">

    <meta name="theme-color" content="#ea580c">

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Rajdhani:wght@600;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../resource/css/base.css">
    <link rel="stylesheet" href="../resource/css/layout.css">
    <link rel="stylesheet" href="../resource/css/responsive.css">
    <link rel="stylesheet" href="../resource/css/components.css">
    <style>
        .admin-wrap { max-width: 960px; margin: 0 auto; padding: 120px 22px 80px; }
        .admin-card { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-lg); box-shadow: var(--shadow-lg); overflow: hidden; position: relative; }
        .admin-card::before { content:""; position:absolute; top:0; left:0; right:0; height:3px; background: var(--flame-grad); }
        .admin-header { padding: 32px 36px 20px; border-bottom: 1px solid var(--line); }
        .admin-header h1 { font-family: var(--display); font-size: 28px; color: var(--text); margin: 0; }
        .admin-header p { color: var(--dim); font-size: 14px; margin: 6px 0 0; }
        .admin-tabs { display: flex; gap: 2px; padding: 0 36px; background: var(--surface-2); }
        .admin-tab { padding: 14px 22px; font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: var(--dim); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; background: transparent; border-top: none; border-left: none; border-right: none; }
        .admin-tab:hover { color:var(--fire-text); }
        .admin-tab.active { color:var(--fire-text); border-bottom-color:var(--fire-text); }
        .admin-body { padding: 28px 36px 36px; min-height: 200px; }
        .admin-placeholder { text-align: center; padding: 60px 0; color: var(--dim); }
        .admin-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .admin-table th, .admin-table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); }
        .admin-table th { font-family: var(--mono); font-size: 11px; color: var(--faint); letter-spacing: 0.08em; text-transform: uppercase; }
        .admin-table td { color: var(--text); }
        .admin-badge { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; }
        .admin-badge.admin { background: var(--fire-soft); color:var(--fire-text); }
        .admin-badge.user { background: var(--spring-soft); color: var(--spring); }
        .admin-badge.sub_admin { background: #e8f5e9; color: #2e7d32; }
        .admin-btn { padding: 6px 14px; font-family: var(--mono); font-size: 11px; font-weight: 700; border-radius: var(--r-sm); cursor: pointer; border: 1px solid var(--line-2); background: transparent; color: var(--dim); transition: all 0.2s; }
        .admin-btn:hover { border-color:var(--fire-text); color:var(--fire-text); }
        .admin-btn.danger:hover { border-color: var(--flame); color: var(--flame); }
        .admin-btn.primary { background: var(--flame-grad); color: #fff; border: none; }
        .admin-btn.primary:hover { filter: brightness(1.05); }
        .admin-loading { text-align: center; padding: 40px; color: var(--dim); }
        .admin-select { padding: 6px 10px; border: 1px solid var(--line-2); border-radius: var(--r-sm); background: var(--bg); color: var(--text); font-size: 13px; }
        @media (max-width: 640px) {
            .admin-header, .admin-body { padding: 24px 20px; }
            .admin-tabs { padding: 0 20px; overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; }
            .admin-tab { white-space: nowrap; flex-shrink: 0; padding: 14px 16px; font-size: 11px; }
            .admin-table { font-size: 12px; }
            .admin-table th, .admin-table td { padding: 8px 6px; }
        }
        /* Toast 提示 */
        .admin-toast { position: fixed; top: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; max-width: 360px; }
        .admin-toast-item { pointer-events: auto; padding: 12px 20px; border-radius: var(--r-sm); font-size: 13px; font-weight: 600; color: #fff; box-shadow: 0 4px 20px rgba(0,0,0,0.2); animation: toastIn 0.25s ease, toastOut 0.3s ease 2.5s forwards; }
        .admin-toast-item.ok { background: #2e7d32; }
        .admin-toast-item.err { background: #c62828; }
        .admin-toast-item.info { background: #1565c0; }
        @keyframes toastIn { from { opacity:0; transform:translateX(40px); } to { opacity:1; transform:translateX(0); } }
        @keyframes toastOut { from { opacity:1; transform:translateX(0); } to { opacity:0; transform:translateX(40px); } }
    </style>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="../" aria-label="返回首页">
            <img src="../resource/img/logo.webp" alt="YHG战队标识" width="34" height="34">
            <span>YHG</span>
        </a>
        <nav class="nav" aria-label="主导航">
            <a href="../">HOME</a>
            <a href="../about/">ABOUT</a>
            <a href="../members/">ROSTER</a>
            <a href="../matches/">MATCHES</a>
            <a href="../news/">NEWS</a>
        </nav>
        <div id="authWidget" style="cursor:default;">管理</div>
    </header>

    <main>
        <div class="admin-wrap">
            <div class="admin-card" id="adminApp">
                <div class="admin-header">
                    <h1>管理面板</h1>
                    <p id="adminStatus">验证身份中…</p>
                </div>
                <div class="admin-tabs" id="adminTabs" style="display:none;">
                    <button class="admin-tab active" data-tab="users">用户管理</button>
                    <button class="admin-tab" data-tab="articles">文章管理</button>
                    <button class="admin-tab" data-tab="bindings">选手绑定</button>
                    <button class="admin-tab" data-tab="players">选手管理</button>
                    <button class="admin-tab" data-tab="matches">赛事管理</button>
                    <button class="admin-tab" data-tab="home">首页管理</button>
                    <button class="admin-tab" data-tab="announcement">公告管理</button>
                </div>
                <div class="admin-body" id="adminBody">
                    <div class="admin-loading">加载中…</div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 YHG ESPORTS</p>
    </footer>

    <script defer src="../resource/js/main.js"></script>
    <script defer src="../resource/js/auth.js"></script>
    <script defer src="../resource/js/admin.js"></script>
</body>
</html>
