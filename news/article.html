<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章 - YHG电子竞技战队</title>
    <link rel="icon" type="image/webp" href="../resource/img/logo.webp">
    <link rel="apple-touch-icon" href="../resource/img/logo.webp">
    <link rel="stylesheet" href="../resource/css/style.css">
    <style>
        .article-wrap { max-width: 720px; margin: 0 auto; padding: 120px 22px 80px; }
        .article-card { padding: 52px 44px; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-lg); box-shadow: var(--shadow-lg); position: relative; overflow: hidden; }
        .article-card::before { content:""; position:absolute; top:0; left:0; right:0; height:3px; background: var(--flame-grad); }
        .article-card h1 { font-family: var(--display); font-size: 32px; color: var(--text); margin: 0 0 8px; }
        .article-meta { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--faint); margin-bottom: 32px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
        .article-meta span { display: flex; align-items: center; gap: 6px; }
        .article-body { font-size: 16px; line-height: 2; color: var(--text); }
        .article-body p { margin: 0 0 1.2em; }
        .article-body br { display: block; content:""; margin: 0.6em 0; }
        .article-loading { text-align: center; padding: 60px 0; color: var(--dim); }
        .article-actions { margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--line); display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
        .btn-del { padding: 8px 18px; font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: var(--flame); background: transparent; border: 1px solid var(--line-hot); border-radius: var(--r-sm); cursor: pointer; transition: all 0.25s var(--ease); }
        .btn-del:hover { background: rgba(239,68,68,0.08); border-color: var(--flame); }

        /* 点赞按钮 */
        .like-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; font-size: 14px; font-weight: 600; border-radius: 99px; cursor: pointer; transition: all 0.25s var(--ease); border: 1px solid var(--line-2); background: transparent; color: var(--dim); }
        .like-btn:hover { border-color: var(--fire); color: var(--fire); }
        .like-btn.liked { background: var(--fire-soft, #fff0f0); border-color: var(--fire); color: var(--fire); }
        .like-btn .heart { transition: transform 0.2s; }
        .like-btn.liked .heart { transform: scale(1.15); }

        /* 评论区 */
        .comment-section { margin-top: 32px; }
        .comment-section h3 { font-family: var(--display); font-size: 18px; color: var(--text); margin: 0 0 16px; }
        .comment-form { display: flex; gap: 10px; margin-bottom: 24px; }
        .comment-form input { flex: 1; padding: 10px 14px; border: 1px solid var(--line-2); border-radius: var(--r-sm); background: var(--bg); color: var(--text); font-size: 14px; outline: none; transition: border 0.2s; }
        .comment-form input:focus { border-color: var(--fire); }
        .comment-form button { padding: 10px 22px; font-family: var(--mono); font-size: 12px; font-weight: 700; background: var(--flame-grad); color: #fff; border: none; border-radius: var(--r-sm); cursor: pointer; white-space: nowrap; }
        .comment-form button:disabled { opacity: 0.5; cursor: not-allowed; }
        .comment-item { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: flex-start; }
        .comment-item:last-child { border-bottom: none; }
        .comment-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--surface-2); flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 14px; color: var(--dim); }
        .comment-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .comment-body { flex: 1; min-width: 0; }
        .comment-author { font-size: 13px; font-weight: 700; color: var(--text); margin-right: 8px; }
        .comment-time { font-size: 11px; color: var(--faint); }
        .comment-text { font-size: 14px; color: var(--text); margin: 4px 0 0; line-height: 1.5; }
        .comment-del { font-size: 11px; color: var(--flame); cursor: pointer; background: none; border: none; padding: 2px 6px; float: right; }
        .comment-del:hover { text-decoration: underline; }
        .comment-placeholder { text-align: center; padding: 30px 0; color: var(--dim); font-size: 14px; }

        @media (max-width: 480px) {
            .article-card { padding: 28px 22px; }
            .article-card h1 { font-size: 24px; }
            .comment-form { flex-direction: column; }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="../" aria-label="返回首页">
            <img src="../resource/img/logo.webp" alt="YHG战队标识">
            <span>YHG</span>
        </a>
        <nav class="nav" aria-label="主导航">
            <a href="../">HOME</a>
            <a href="../about/">ABOUT</a>
            <a href="../members/">ROSTER</a>
            <a href="../matches/">MATCHES</a>
            <a class="active" href="./">NEWS</a>
        </nav>
        <div id="authWidget" style="cursor:default;">文章</div>
    </header>

    <main>
        <div class="article-wrap">
            <div class="article-card reveal in" data-delay="1" id="articleContent">
                <div class="article-loading">加载中…</div>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 YHG ESPORTS · Honor of Kings esports team</p>
    </footer>

    <script defer src="../resource/js/auth.js"></script>
    <script>
        (async function() {
            const slug = new URLSearchParams(window.location.search).get('slug');
            if (!slug) {
                document.getElementById('articleContent').innerHTML = '<p style="text-align:center;color:var(--dim);">缺少文章标识</p>';
                return;
            }

            // 获取当前登录用户信息（异步，不阻塞渲染）
            let currentUser = null;
            try {
                const meResp = await fetch('/api/auth/me');
                if (meResp.ok) currentUser = (await meResp.json()).user;
            } catch(e) {}

            // 加载文章
            let articleData;
            try {
                const resp = await fetch('/api/news/' + slug);
                if (!resp.ok) throw new Error('not found');
                articleData = await resp.json();
            } catch(e) {
                document.getElementById('articleContent').innerHTML = '<p style="text-align:center;color:var(--dim);">文章不存在或加载失败</p>';
                return;
            }

            const a = articleData.article;
            const created = a.created_at ? new Date(a.created_at + 'Z').toLocaleString('zh-CN') : '';

            const el = document.getElementById('articleContent');
            el.innerHTML = `
                <h1>${a.title}</h1>
                <div class="article-meta">
                    <span>✍ ${a.username}</span>
                    <span>📅 ${created}</span>
                    <span id="likeDisplay">❤ ${a.like_count || 0}</span>
                </div>
                <div class="article-body">${a.content.replace(/\n/g, '<br>')}</div>
                <div class="article-actions">
                    <button class="like-btn ${a.liked_by_me ? 'liked' : ''}" id="likeBtn">
                        <span class="heart">${a.liked_by_me ? '❤' : '♡'}</span>
                        <span id="likeCount">${a.like_count || 0}</span>
                    </button>
                    <a class="ghost-btn" href="./">← 返回新闻</a>
                    ${currentUser ? `<a class="ghost-btn" href="write.html?edit=${slug}" style="text-decoration:none;font-size:13px;">✏ 编辑</a>` : ''}
                    ${currentUser ? `<button class="btn-del" id="delBtn">删除</button>` : ''}
                </div>
                <div class="comment-section">
                    <h3>💬 评论</h3>
                    ${currentUser ? `
                        <div class="comment-form">
                            <input type="text" id="commentInput" placeholder="写下你的评论…" maxlength="500">
                            <button id="commentSubmit">发表</button>
                        </div>
                    ` : '<p style="color:var(--dim);font-size:13px;margin-bottom:16px;"><a href="../login.html" style="color:var(--fire);">登录</a>后可以评论</p>'}
                    <div id="commentList"><div class="comment-placeholder">加载评论中…</div></div>
                </div>
            `;

            // === 点赞 ===
            const likeBtn = document.getElementById('likeBtn');
            if (currentUser) {
                likeBtn.addEventListener('click', async () => {
                    const resp = await fetch('/api/news/' + slug + '/like', { method: 'POST' });
                    if (resp.ok) {
                        const data = await resp.json();
                        document.getElementById('likeCount').textContent = data.like_count;
                        document.getElementById('likeDisplay').textContent = '❤ ' + data.like_count;
                        likeBtn.classList.toggle('liked', data.liked);
                        likeBtn.querySelector('.heart').textContent = data.liked ? '❤' : '♡';
                    }
                });
            } else {
                likeBtn.addEventListener('click', () => {
                    window.location.href = '../login.html';
                });
            }

            // === 删除 ===
            document.getElementById('delBtn')?.addEventListener('click', async () => {
                if (!confirm('确定删除这篇文章？')) return;
                const resp = await fetch('/api/news/' + slug, { method: 'DELETE' });
                if (resp.ok) { window.location.href = './'; }
                else { const err = await resp.json(); alert(err.error || '删除失败'); }
            });

            // === 加载评论 ===
            await loadComments(slug, currentUser);

            // === 发表评论 ===
            const submitBtn = document.getElementById('commentSubmit');
            const input = document.getElementById('commentInput');
            if (submitBtn && input) {
                submitBtn.addEventListener('click', async () => {
                    const content = input.value.trim();
                    if (!content) return;
                    submitBtn.disabled = true;
                    const resp = await fetch('/api/news/' + slug + '/comments', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ content })
                    });
                    if (resp.ok) {
                        input.value = '';
                        await loadComments(slug, currentUser);
                    } else {
                        const err = await resp.json();
                        alert(err.error || '发表失败');
                    }
                    submitBtn.disabled = false;
                });
                input.addEventListener('keydown', e => {
                    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitBtn.click(); }
                });
            }
        })();

        // 加载评论列表
        async function loadComments(slug, currentUser) {
            const list = document.getElementById('commentList');
            try {
                const resp = await fetch('/api/news/' + slug + '/comments');
                const data = await resp.json();
                if (!data.ok || !data.comments || data.comments.length === 0) {
                    list.innerHTML = '<div class="comment-placeholder">暂无评论，快来抢沙发吧</div>';
                    return;
                }
                let html = '';
                data.comments.forEach(c => {
                    const time = c.created_at ? new Date(c.created_at + 'Z').toLocaleString('zh-CN') : '';
                    const avatarHtml = c.avatar ? `<img src="${c.avatar}" alt="">` : '👤';
                    const canDel = currentUser && (currentUser.id === c.user_id || currentUser.role === 'admin' || currentUser.role === 'sub_admin');
                    html += `
                        <div class="comment-item">
                            <div class="comment-avatar">${avatarHtml}</div>
                            <div class="comment-body">
                                <div>
                                    <span class="comment-author">${c.username}</span>
                                    <span class="comment-time">${time}</span>
                                    ${canDel ? `<button class="comment-del" onclick="deleteComment('${slug}', ${c.id})">删除</button>` : ''}
                                </div>
                                <div class="comment-text">${c.content}</div>
                            </div>
                        </div>
                    `;
                });
                list.innerHTML = html;
            } catch(e) {
                list.innerHTML = '<div class="comment-placeholder">评论加载失败</div>';
            }
        }

        async function deleteComment(slug, id) {
            if (!confirm('确定删除这条评论？')) return;
            const resp = await fetch('/api/news/' + slug + '/comments/' + id, { method: 'DELETE' });
            if (resp.ok) {
                await loadComments(slug, currentUser);
            } else {
                const err = await resp.json();
                alert(err.error || '删除失败');
            }
        }

        const revealIO = new IntersectionObserver((entries) => {
          entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add('in'); revealIO.unobserve(en.target); } });
        }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
        document.querySelectorAll('.reveal:not(.in)').forEach(el => revealIO.observe(el));
    </script>
</body>
</html>
