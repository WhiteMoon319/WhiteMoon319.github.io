<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>写文章 - YHG电子竞技战队</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/webp" href="../resource/img/logo.webp">
    <link rel="apple-touch-icon" href="../resource/img/logo.webp">
    <meta name="description" content="撰写新文章 - YHG 战队新闻后台。">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="zh_CN">
    <meta property="og:title" content="写文章 - YHG电子竞技战队">
    <meta property="og:description" content="撰写新文章 - YHG 战队新闻后台。">
    <meta property="og:url" content="https://yhg.whitemoon319.xyz/news/write/">
    <link rel="canonical" href="https://yhg.whitemoon319.xyz/news/write/">
    <meta property="og:image" content="https://yhg.whitemoon319.xyz/resource/img/logo.webp">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ea580c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Rajdhani:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../resource/css/base.css">
    <link rel="stylesheet" href="../resource/css/layout.css">
    <link rel="stylesheet" href="../resource/css/responsive.css">
    <link rel="stylesheet" href="../resource/css/components.css">
    <style>
        .write-wrap {
            max-width: 760px;
            margin: 0 auto;
            padding: 120px 22px 80px;
        }
        .write-card {
            padding: 44px 38px;
            background: var(--surface);
            border: 1px solid var(--line-2);
            border-radius: var(--r-lg);
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
        }
        .write-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: var(--flame-grad);
        }
        .write-card h1 {
            font-family: var(--display);
            font-size: 28px;
            color: var(--text);
            margin: 0 0 6px;
        }
        .write-card p.sub {
            color: var(--dim);
            font-size: 14px;
            margin: 0 0 28px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-family: var(--mono);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--dim);
            margin-bottom: 6px;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            font-family: var(--sans);
            color: var(--text);
            background: var(--bg);
            border: 1px solid var(--line-2);
            border-radius: var(--r-sm);
            outline: none;
            transition: border-color 0.25s var(--ease), box-shadow 0.25s var(--ease);
            box-sizing: border-box;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--fire-2);
            box-shadow: 0 0 0 3px var(--fire-soft);
        }
        .form-group textarea {
            min-height: 360px;
            resize: vertical;
            line-height: 1.85;
        }
        .form-group .hint {
            margin-top: 4px;
            font-size: 12px;
            color: var(--faint);
        }
        .form-error {
            color: var(--flame);
            font-size: 13px;
            margin: 0 0 16px;
            min-height: 20px;
        }
        .submit-row {
            display: flex;
            gap: 14px;
            align-items: center;
            flex-wrap: wrap;
        }
        .auth-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 48px;
            padding: 0 32px;
            color: #fff;
            font-family: var(--mono);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            background: var(--flame-grad);
            border: 1px solid rgba(255,255,255,0.45);
            border-radius: var(--r-sm);
            box-shadow: 0 6px 18px var(--fire-glow), inset 0 1px 0 rgba(255,255,255,0.45);
            cursor: pointer;
            transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease);
        }
        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px var(--fire-glow-2);
        }
        .auth-btn:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }
        @media (max-width: 480px) {
            .write-card { padding: 28px 22px; }
            .form-group textarea { min-height: 260px; }
        }
    </style>
  <script defer src="../resource/js/main.js"></script>
    <script defer src="../resource/js/auth.js"></script>
    <script defer src="../resource/js/news-write.js"></script>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="../" aria-label="返回首页">
            <img src="../resource/img/logo.webp" alt="YHG战队标识" width="34" height="34">
            <span>YHG</span>
        </a>
        <nav class="nav" aria-label="主导航">
            <a href="../">HOME</a>
            <a href="../about/">ABOUT</a>
            <a href="../members/">ROSTER</a>
            <a href="../matches/">MATCHES</a>
            <a class="active" href="./">NEWS</a>
        </nav>
        <div id="authWidget" style="cursor:default;">写文章</div>
    </header>

    <main>
        <div class="write-wrap reveal in" data-delay="1">
            <div class="write-card">
                <h1 id="pageTitle">写文章</h1>
                <p class="sub" id="pageSub">发布战队新闻、战报或故事</p>
                <div class="form-error" id="formError"></div>
                <form id="articleForm">
                    <div class="form-group">
                        <label for="title">标题</label>
                        <input type="text" id="title" name="title" placeholder="文章标题" required maxlength="120">
                    </div>
                    <div class="form-group">
                        <label for="summary">摘要（可选）</label>
                        <input type="text" id="summary" name="summary" placeholder="一段简短的介绍，显示在文章卡片上">
                    </div>
                    <div class="form-group">
                        <label for="content">正文</label>
                        <textarea id="content" name="content" placeholder="写点什么…" required></textarea>
                        <div class="hint">支持纯文本和 HTML 标签</div>
                    </div>
                    <div class="submit-row">
                        <button class="auth-btn" type="submit" id="submitBtn">发布文章</button>
                        <a href="./" style="color:var(--dim);font-size:14px;">取消</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 YHG ESPORTS · Honor of Kings esports team</p>
    </footer>

</body>
</html>
