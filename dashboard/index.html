    <link rel="stylesheet" href="../resource/css/style.css">
    <style>
        .dash-wrap { max-width: 680px; margin: 0 auto; padding: 120px 22px 80px; }
        .dash-card { padding: 44px 38px; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-lg); box-shadow: var(--shadow-lg); position: relative; overflow: hidden; }
        .dash-card::before { content:""; position:absolute; top:0; left:0; right:0; height:3px; background: var(--flame-grad); }
        .dash-card h1 { font-family: var(--display); font-size: 28px; color: var(--text); margin: 0; }
        .dash-email { color: var(--dim); font-size: 14px; margin: 2px 0 28px; }
        .dash-section { margin-bottom: 28px; padding-bottom: 28px; border-bottom: 1px solid var(--line); }
        .dash-section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .dash-section h2 { font-family: var(--display); font-size: 16px; color: var(--fire); margin: 0 0 14px; }
        .avatar-area { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
        .avatar-preview { width: 80px; height: 80px; border-radius: 50%; overflow: hidden; background: var(--surface-2); display: flex; align-items: center; justify-content: center; font-size: 36px; border: 2px solid var(--line-2); flex-shrink: 0; }
        .avatar-preview img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .avatar-actions { display: flex; flex-direction: column; gap: 6px; }
        .avatar-actions label { font-size: 12px; color: var(--dim); }
        .avatar-actions input[type="text"] { padding: 8px 12px; border: 1px solid var(--line-2); border-radius: var(--r-sm); background: var(--bg); color: var(--text); font-size: 13px; width: 260px; max-width: 100%; }
        .avatar-actions input[type="file"] { font-size: 12px; color: var(--dim); }
        .form-row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
        .form-row label { font-size: 13px; color: var(--dim); min-width: 70px; }
        .form-row input[type="text"] { flex: 1; min-width: 150px; padding: 8px 12px; border: 1px solid var(--line-2); border-radius: var(--r-sm); background: var(--bg); color: var(--text); font-size: 14px; outline: none; transition: border 0.2s; }
        .form-row input[type="text"]:focus { border-color: var(--fire); }
        .btn-save { padding: 8px 20px; font-family: var(--mono); font-size: 12px; font-weight: 700; background: var(--flame-grad); color: #fff; border: none; border-radius: var(--r-sm); cursor: pointer; white-space: nowrap; }
        .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-save.small { padding: 6px 14px; font-size: 11px; }
        .hint-ok { font-size: 12px; color: var(--spring); }
        .hint-err { font-size: 12px; color: var(--flame); }
        .hint { font-size: 12px; color: var(--dim); }
        .dash-info { display: grid; grid-template-columns: 120px 1fr; gap: 8px 20px; font-size: 15px; }
        .dash-info dt { color: var(--faint); font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; }
        .dash-info dd { color: var(--text); margin: 0; }
        .loading { text-align: center; padding: 60px 0; color: var(--dim); }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 24px; border-radius: 99px; font-size: 14px; z-index: 999; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .toast.show { opacity: 1; }
        @media (max-width: 480px) { .dash-card { padding: 28px 22px; } .dash-info { grid-template-columns: 1fr; } .avatar-area { flex-direction: column; align-items: flex-start; } }
    </style>
</head>
<body>
    <div class="toast" id="toast"></div>
    <header class="site-header">
        <a class="brand" href="./"><img src="../resource/img/logo.webp" alt="YHG"><span>YHG</span></a>
        <nav class="nav">
            <a href="./">HOME</a><a href="about/">ABOUT</a><a href="members/">ROSTER</a><a href="matches/">MATCHES</a><a href="news/">NEWS</a>
        </nav>
        <span id="authStateBtn" style="cursor:default;">用户</span>
    </header>
    <main>
        <div class="dash-wrap reveal in" data-delay="1">
            <div class="dash-card" id="dashContent"><div class="loading">加载中…</div></div>
        </div>
    </main>
    <footer><p>© 2026 YHG ESPORTS</p></footer>
  <script defer src="../resource/js/main.js"></script>
    <script defer src="../resource/js/auth.js"></script>
    <script defer src="../resource/js/dashboard.js"></script>
</body>
</html>
