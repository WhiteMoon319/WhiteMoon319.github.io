<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑选手资料 - YHG电子竞技战队</title>
    <link rel="icon" type="image/webp" href="../resource/img/logo.webp">
    <link rel="apple-touch-icon" href="../resource/img/logo.webp">
    <link rel="stylesheet" href="../resource/css/style.css">
    <style>
        .edit-wrap { max-width: 760px; margin: 0 auto; padding: 120px 22px 80px; }
        .edit-card { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-lg); box-shadow: var(--shadow-lg); overflow: hidden; position: relative; padding: 44px 38px; }
        .edit-card::before { content:""; position:absolute; top:0; left:0; right:0; height:3px; background: var(--flame-grad); }
        .edit-card h1 { font-family: var(--display); font-size: 28px; color: var(--text); margin: 0; }
        .edit-card p.sub { color: var(--dim); font-size: 14px; margin: 4px 0 28px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display:block; font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:var(--dim); margin-bottom:6px; }
        .form-group input, .form-group textarea { width:100%; padding:12px 16px; font-size:15px; font-family:var(--sans); color:var(--text); background:var(--bg); border:1px solid var(--line-2); border-radius:var(--r-sm); outline:none; transition:border-color 0.25s var(--ease); box-sizing:border-box; }
        .form-group input:focus, .form-group textarea:focus { border-color:var(--fire-2); box-shadow:0 0 0 3px var(--fire-soft); }
        .form-group textarea { min-height:100px; resize:vertical; line-height:1.85; }
        .form-group .hint { margin-top:4px; font-size:12px; color:var(--faint); }
        .form-error { color:var(--flame); font-size:13px; margin:0 0 16px; min-height:20px; }
        .submit-row { display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-top:24px; padding-top:20px; border-top:1px solid var(--line); }
        .auth-btn { display:inline-flex; align-items:center; justify-content:center; height:46px; padding:0 30px; color:#fff; font-family:var(--mono); font-size:13px; font-weight:700; letter-spacing:0.15em; text-transform:uppercase; background:var(--flame-grad); border:1px solid rgba(255,255,255,0.45); border-radius:var(--r-sm); box-shadow:0 6px 18px var(--fire-glow),inset 0 1px 0 rgba(255,255,255,0.45); cursor:pointer; transition:transform 0.25s var(--ease); }
        .auth-btn:hover { transform:translateY(-2px); }
        .auth-btn:disabled { opacity:0.6; transform:none; cursor:not-allowed; }
        .stats-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
        .stat-item input { padding:10px 12px; font-size:14px; text-align:center; }
        .loading { text-align:center; padding:60px 0; color:var(--dim); }
        @media (max-width:640px) { .edit-card { padding:28px 22px; } .stats-grid { grid-template-columns:repeat(2,1fr); } }
    </style>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="../" aria-label="返回首页"><img src="../resource/img/logo.webp" alt="YHG"><span>YHG</span></a>
        <nav class="nav" aria-label="主导航">
            <a href="../">HOME</a>
            <a href="../about/">ABOUT</a>
            <a class="active" href="../members/">ROSTER</a>
            <a href="../matches/">MATCHES</a>
            <a href="../news/">NEWS</a>
        </nav>
        <div id="authWidget" style="cursor:default;">编辑</div>
    </header>

    <main>
        <div class="edit-wrap reveal in" data-delay="1">
            <div class="edit-card" id="editApp">
                <div class="loading">验证身份…</div>
            </div>
        </div>
    </main>

    <footer><p>© 2026 YHG ESPORTS</p></footer>

    <script defer src="../resource/js/auth.js"></script>
    <script>
    (async function() {
        const app = document.getElementById('editApp');
        const params = new URLSearchParams(window.location.search);
        const slug = params.get('slug');

        if (!slug) {
            app.innerHTML = '<p style="text-align:center;color:var(--dim);padding:40px 0;">缺少选手标识</p>';
            return;
        }

        // 验证身份
        let currentUser = null;
        try {
            const meResp = await fetch('/api/auth/me');
            if (meResp.ok) {
                currentUser = (await meResp.json()).user;
            }
        } catch(e) {}

        // 获取选手资料
        let player = null;
        try {
            const resp = await fetch('/api/players/' + slug);
            if (!resp.ok) throw new Error('not found');
            player = (await resp.json()).player;
        } catch(e) {
            app.innerHTML = '<p style="text-align:center;color:var(--dim);padding:40px 0;">选手资料不存在</p>';
            return;
        }

        // 验证权限
        let canEdit = false;
        try {
            const adminResp = await fetch('/api/admin/check');
            if (adminResp.ok) canEdit = true;
        } catch(e) {}

        if (!canEdit && currentUser) {
            const meResp2 = await fetch('/api/auth/me');
            if (meResp2.ok) {
                const meData = await meResp2.json();
                const bound = meData.user.bound_players || [];
                canEdit = bound.includes(slug);
            }
        }

        if (!currentUser) {
            app.innerHTML = `<div style="text-align:center;padding:40px 0;">
                <p style="color:var(--dim);">请先登录</p>
                <p style="margin-top:12px;"><a href="../login/" style="color:var(--fire);">去登录</a></p>
            </div>`;
            return;
        }

        if (!canEdit) {
            app.innerHTML = `<div style="text-align:center;padding:40px 0;">
                <p style="color:var(--dim);">你没有编辑 ${player.id_name} 资料的权限</p>
                <p style="margin-top:12px;"><a href="../members/" style="color:var(--fire);">返回阵容</a></p>
            </div>`;
            return;
        }

        // 解析 stats
        let stats = {};
        try { stats = JSON.parse(player.stats || '{}'); } catch(e) {}

        // 渲染编辑表单
        app.innerHTML = `
            <h1>编辑资料</h1>
            <p class="sub">${player.id_name}（${player.name}）</p>
            <div class="form-error" id="formError"></div>
            <form id="editForm">
                <div class="form-group">
                    <label>真名</label>
                    <input type="text" id="name" value="${player.name || ''}">
                </div>
                <div class="form-group" style="max-width:120px;">
                    <label>年龄</label>
                    <input type="number" id="age" value="${player.age || ''}" min="0" max="99">
                </div>
                <div class="form-group">
                    <label>荣誉</label>
                    <input type="text" id="titles" value="${player.titles || ''}" placeholder="例: 两冠三四强">
                </div>
                <div class="form-group">
                    <label>简介 / 一句话介绍</label>
                    <textarea id="bio">${player.bio || ''}</textarea>
                </div>
                <div class="form-group">
                    <label>经历</label>
                    <textarea id="experience" style="min-height:140px;">${player.experience || ''}</textarea>
                </div>
                <div class="form-group">
                    <label>性格</label>
                    <textarea id="personality">${player.personality || ''}</textarea>
                </div>
                <div class="form-group">
                    <label>锚点 / 个人特征</label>
                    <textarea id="anchor">${player.anchor || ''}</textarea>
                </div>
                <div class="form-group">
                    <label>属性面板</label>
                    <div class="stats-grid" id="statsGrid"></div>
                    <div class="hint">每个属性 1-20 之间的数值</div>
                </div>
                <div class="submit-row">
                    <button class="auth-btn" type="submit" id="submitBtn">保存修改</button>
                    <a href="../members/${slug}/" style="color:var(--dim);font-size:14px;">取消</a>
                </div>
            </form>
        `;

        // 渲染属性格子
        const statKeys = ['智商', '情商', '实力', '颜值', '素质', '运气'];
        const statGrid = document.getElementById('statsGrid');
        statKeys.forEach(k => {
            const val = stats[k] || '';
            statGrid.innerHTML += `<div class="stat-item"><label style="font-family:var(--mono);font-size:11px;color:var(--dim);display:block;margin-bottom:4px;">${k}</label><input type="number" class="stat-input" data-key="${k}" value="${val}" min="1" max="20"></div>`;
        });

        // 提交
        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorEl = document.getElementById('formError');
            const btn = document.getElementById('submitBtn');

            const newStats = {};
            document.querySelectorAll('.stat-input').forEach(inp => {
                const v = parseInt(inp.value);
                if (!isNaN(v)) newStats[inp.dataset.key] = v;
            });

            btn.disabled = true;
            btn.textContent = '保存中…';
            errorEl.textContent = '';

            try {
                const resp = await fetch('/api/players/' + slug, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: document.getElementById('name').value,
                        age: parseInt(document.getElementById('age').value) || 0,
                        titles: document.getElementById('titles').value,
                        bio: document.getElementById('bio').value,
                        experience: document.getElementById('experience').value,
                        personality: document.getElementById('personality').value,
                        anchor: document.getElementById('anchor').value,
                        stats: newStats
                    })
                });
                const data = await resp.json();
                if (resp.ok) {
                    errorEl.style.color = 'var(--spring)';
                    errorEl.textContent = '✅ 保存成功！';
                    btn.textContent = '已保存';
                    setTimeout(() => { window.location.href = 'profile.html?slug=' + slug; }, 1500);
                } else {
                    errorEl.textContent = data.error || '保存失败';
                    btn.disabled = false;
                    btn.textContent = '保存修改';
                }
            } catch(e) {
                errorEl.textContent = '网络错误';
                btn.disabled = false;
                btn.textContent = '保存修改';
            }
        });
    })();

    const revealIO = new IntersectionObserver((entries) => {
      entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add('in'); revealIO.unobserve(en.target); } });
    }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
    document.querySelectorAll('.reveal:not(.in)').forEach(el => revealIO.observe(el));
    </script>
</body>
</html>
